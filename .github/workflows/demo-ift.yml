name: cosmos-evm IBC demo setup

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: demo/cosmos-evm

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_PULL_USERNAME }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}

      - name: Run setup.sh (init chains, deploy IFT bridges, run demos)
        env:
          ETH2_TESTNET_GENESIS_IMAGE: ethpandaops/ethereum-genesis-generator:master-linux-amd64
          PYTHONUNBUFFERED: "1"
        run: ./setup.sh