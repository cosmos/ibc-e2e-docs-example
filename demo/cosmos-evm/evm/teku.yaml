# Teku consensus-layer configuration for IBC devnet
# cl-config.yaml is in evm/ (read-only host mount at /evm inside container)
# cl-genesis.ssz and validator keystores live in the teku-data volume (/data)
network: "/evm/cl-config.yaml"
initial-state: "/evm/cl-genesis.ssz"

# Execution engine (Besu Engine API)
ee-endpoint: "http://besu:8551"
ee-jwt-secret-file: "/evm/jwt.hex"

# Beacon REST API (port 5051)
rest-api-enabled: true
rest-api-interface: "0.0.0.0"
rest-api-port: 5051
rest-api-host-allowlist: ["*"]
rest-api-docs-enabled: false

# Data
data-base-path: "/data"

# Validator keystores — generated by setup.sh into /data/validators/ (teku volume)
# keys dir: EIP-2335 keystores; secrets dir: matching plain-text password files
# Both generated from DEVNET_MNEMONIC via eth2-val-tools (EIP-2333 derivation)
validator-keys: "/data/validators/keys:/data/validators/secrets"
validators-proposer-default-fee-recipient: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
validators-keystore-locking-enabled: false

# Networking — single-node devnet, no peers needed
p2p-enabled: false

# Devnet: genesis-time=0 is outside the weak subjectivity period; disable the check
ignore-weak-subjectivity-period-enabled: true

# Logging
log-destination: CONSOLE
logging: INFO
