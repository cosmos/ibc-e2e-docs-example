# besu-trio: 3 single-validator Besu QBFT chains (A, hub, B) + IBC stack.
#
# Topology — A and B each peer with hub only; A and B do not talk directly.
# All three chains run QBFT with one validator each.
#
# Attestors (4 total, one per direction):
#   attestor-A-to-hub : watches besu-a   (its sigs feed the LC-tracking-A on hub)
#   attestor-hub-to-A : watches besu-hub (feeds LC-tracking-hub on A)
#   attestor-hub-to-B : watches besu-hub (feeds LC-tracking-hub on B)
#   attestor-B-to-hub : watches besu-b   (feeds LC-tracking-B on hub)
#
# Relayer: a single instance with all three chains in `chains:` and two
# counterparty_chains entries on the hub (one for A, one for B). Schema
# supports it — see ibc-relayer-v0.0.2 — but multi-counterparty-per-chain is
# not exercised by the cosmos-evm demo and may need adjustment at runtime.
#
# Internal Besu ports inside each container are identical (8545 RPC, 8546 WS,
# 30303 P2P, 9545 metrics). Only host-side mappings differ per chain.
# Chain IDs: A=41001, hub=41000, B=41002.

services:

  # ── Chains ────────────────────────────────────────────────────────────────
  besu-a:
    image: ${BESU_IMAGE:-hyperledger/besu:25.4.0}
    container_name: besu-a
    command:
      - "--config-file=/evm/besu.toml"
      - "--metrics-enabled"
      - "--metrics-host=0.0.0.0"
      - "--metrics-port=9545"
      - "--Xqbft-enable-early-round-change"
    ports:
      - "8545:8545"
      - "8546:8546"
      - "9545:9545"
    volumes:
      - besu-a-data:/data
      - ./chains/A:/evm:ro
    networks: [ besu-trio-net ]
    restart: on-failure
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8545" ]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  besu-hub:
    image: ${BESU_IMAGE:-hyperledger/besu:25.4.0}
    container_name: besu-hub
    command:
      - "--config-file=/evm/besu.toml"
      - "--metrics-enabled"
      - "--metrics-host=0.0.0.0"
      - "--metrics-port=9545"
      - "--Xqbft-enable-early-round-change"
    ports:
      - "8645:8545"
      - "8646:8546"
      - "9645:9545"
    volumes:
      - besu-hub-data:/data
      - ./chains/hub:/evm:ro
    networks: [ besu-trio-net ]
    restart: on-failure
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8545" ]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  besu-b:
    image: ${BESU_IMAGE:-hyperledger/besu:25.4.0}
    container_name: besu-b
    command:
      - "--config-file=/evm/besu.toml"
      - "--metrics-enabled"
      - "--metrics-host=0.0.0.0"
      - "--metrics-port=9545"
      - "--Xqbft-enable-early-round-change"
    ports:
      - "8745:8545"
      - "8746:8546"
      - "9745:9545"
    volumes:
      - besu-b-data:/data
      - ./chains/B:/evm:ro
    networks: [ besu-trio-net ]
    restart: on-failure
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8545" ]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  # ── Relayer database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: ibc-postgres
    environment:
      POSTGRES_USER: relayer
      POSTGRES_PASSWORD: relayer
      POSTGRES_DB: relayer
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [ besu-trio-net ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U relayer" ]
      interval: 5s
      timeout: 3s
      retries: 30

  # ── Attestors (4, one per direction) ──────────────────────────────────────
  # All 4 are chain-type evm. Each has its own keystore under ibc/local/keys/<name>.
  # The TOML each one reads from ibc/local/attestor-<name>.toml is rendered
  # by lib/ibc.sh::render_ibc_configs from attestor-config.toml.tmpl.

  attestor-A-to-hub:
    image: ${ATTESTOR_IMAGE:-ghcr.io/cosmos/ibc-attestor:latest}
    container_name: attestor-A-to-hub
    command: [ "server", "--config", "/config/attestor-A-to-hub.toml", "--chain-type", "evm", "--signer-type", "local" ]
    volumes:
      - ./ibc/local:/config:ro
      - attestor-A-to-hub-data:/data
    networks: [ besu-trio-net ]
    depends_on:
      besu-a:   { condition: service_healthy }
    restart: on-failure

  attestor-hub-to-A:
    image: ${ATTESTOR_IMAGE:-ghcr.io/cosmos/ibc-attestor:latest}
    container_name: attestor-hub-to-A
    command: [ "server", "--config", "/config/attestor-hub-to-A.toml", "--chain-type", "evm", "--signer-type", "local" ]
    volumes:
      - ./ibc/local:/config:ro
      - attestor-hub-to-A-data:/data
    networks: [ besu-trio-net ]
    depends_on:
      besu-hub: { condition: service_healthy }
    restart: on-failure

  attestor-hub-to-B:
    image: ${ATTESTOR_IMAGE:-ghcr.io/cosmos/ibc-attestor:latest}
    container_name: attestor-hub-to-B
    command: [ "server", "--config", "/config/attestor-hub-to-B.toml", "--chain-type", "evm", "--signer-type", "local" ]
    volumes:
      - ./ibc/local:/config:ro
      - attestor-hub-to-B-data:/data
    networks: [ besu-trio-net ]
    depends_on:
      besu-hub: { condition: service_healthy }
    restart: on-failure

  attestor-B-to-hub:
    image: ${ATTESTOR_IMAGE:-ghcr.io/cosmos/ibc-attestor:latest}
    container_name: attestor-B-to-hub
    command: [ "server", "--config", "/config/attestor-B-to-hub.toml", "--chain-type", "evm", "--signer-type", "local" ]
    volumes:
      - ./ibc/local:/config:ro
      - attestor-B-to-hub-data:/data
    networks: [ besu-trio-net ]
    depends_on:
      besu-b:   { condition: service_healthy }
    restart: on-failure

  # ── Proof API (single instance, knows about all 3 chains + 4 attestors) ──
  proof-api:
    image: ${PROOF_API_IMAGE:-ghcr.io/cosmos/proof-api:latest}
    container_name: ibc-proof-api
    volumes:
      - ./ibc/local/relayer.json:/usr/local/relayer/relayer.json:ro
    networks: [ besu-trio-net ]
    depends_on:
      besu-a:            { condition: service_healthy }
      besu-hub:          { condition: service_healthy }
      besu-b:            { condition: service_healthy }
      attestor-A-to-hub: { condition: service_started }
      attestor-hub-to-A: { condition: service_started }
      attestor-hub-to-B: { condition: service_started }
      attestor-B-to-hub: { condition: service_started }
    restart: on-failure

  # ── Relayer (single instance — all 3 chains in `chains:`) ────────────────
  relayer:
    image: ${OPERATOR_IMAGE:-ghcr.io/cosmos/ibc-relayer:v0.0.2}
    container_name: ibc-relayer
    command: [ "start" ]
    environment:
      POSTGRES_USER: relayer
      POSTGRES_PASSWORD: relayer
    volumes:
      - ./ibc:/home/nonroot/config:ro
      - relayer-data:/relayer
    networks: [ besu-trio-net ]
    depends_on:
      postgres:   { condition: service_healthy }
      besu-a:     { condition: service_healthy }
      besu-hub:   { condition: service_healthy }
      besu-b:     { condition: service_healthy }
      proof-api:  { condition: service_started }
    restart: on-failure

volumes:
  besu-a-data:
  besu-hub-data:
  besu-b-data:
  postgres-data:
  relayer-data:
  attestor-A-to-hub-data:
  attestor-hub-to-A-data:
  attestor-hub-to-B-data:
  attestor-B-to-hub-data:

networks:
  besu-trio-net:
    driver: bridge
