# Besu execution-layer config for chain A (besu-trio)
genesis-file           = "/evm/el-genesis.json"
data-path              = "/data"

# QBFT signing key — derives address 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266,
# the sole validator encoded in the genesis extraData for chain A.
node-private-key-file  = "/evm/key"

# Networking — single-validator devnet, but p2p must be enabled or QBFT's pivot
# selector blocks waiting for peers. Discovery off + no bootnodes keeps it solo.
p2p-enabled          = true
discovery-enabled    = false
bootnodes            = []
host-allowlist       = ["*"]

rpc-http-enabled     = true
rpc-http-host        = "0.0.0.0"
rpc-http-port        = 8545
rpc-http-cors-origins = ["*"]
rpc-http-api         = ["ETH","NET","WEB3","TXPOOL","DEBUG","ADMIN","QBFT"]

rpc-ws-enabled       = true
rpc-ws-host          = "0.0.0.0"
rpc-ws-port          = 8546
rpc-ws-api           = ["ETH","NET","WEB3","TXPOOL"]

sync-mode            = "FULL"
sync-min-peers       = 0
