# Besu execution-layer config for chain B (besu-trio)
genesis-file           = "/evm/el-genesis.json"
data-path              = "/data"

# QBFT signing key — derives address 0x3C44CdDdB6a900fA2b585dd299e03d12FA4293BC,
# the sole validator encoded in the genesis extraData for chain B.
node-private-key-file  = "/evm/key"

p2p-enabled          = true
discovery-enabled    = false
bootnodes            = []
host-allowlist       = ["*"]

rpc-http-enabled     = true
rpc-http-host        = "0.0.0.0"
rpc-http-port        = 8545
rpc-http-cors-origins = ["*"]
rpc-http-api         = ["ETH","NET","WEB3","TXPOOL","DEBUG","ADMIN","QBFT"]

rpc-ws-enabled       = true
rpc-ws-host          = "0.0.0.0"
rpc-ws-port          = 8546
rpc-ws-api           = ["ETH","NET","WEB3","TXPOOL"]

sync-mode            = "FULL"
sync-min-peers       = 0
